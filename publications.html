    <style>
        /* Typography System */
        .large-title {
            font-family: 'Londrina Solid', Arial, sans-serif;
            font-weight: 300;
            font-size: 50pt;
            line-height: 1.2;
        }

        h1 {
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 600;
            font-size: 20pt;
            line-height: 1.3;
        }

        h2 {
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 400;
            font-size: 13pt;
            line-height: 1.4;
        }

        .normal-text {
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 300;
            font-size: 12pt;
            line-height: 1.5;
        }

        .small-text {
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 400;
            font-size: 10pt;
            line-height: 1.4;
        }

        /* Color Variables */
        :root {
            --terracota-profunda: #B54320;
            --azul-escuro: #0F4050;
            --azul-intermediario: #176078;
            --terracota-escura: #8A3319;
            --off-white: #F5EDE4;
            --texto-principal: #1F1F1F;
        }

        /* Body and Base Styles */
        body {
            background-color: var(--off-white);
            color: var(--texto-principal);
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 300;
            font-size: 12pt;
            line-height: 1.5;
        }

        /* Main Content Area */
        .main-content {
            background-color: var(--off-white);
            padding: 2rem 0;
        }

        /* Page Title */
        .page-title {
            font-family: 'Londrina Solid', Arial, sans-serif;
            font-weight: 300;
            font-size: 50pt;
            color: var(--off-white);
            text-align: center;
            margin-bottom: 3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* Publication Items */
        .publication-item {
            margin-bottom: 2rem;
            padding: 1.5rem;
            border-left: 4px solid var(--azul-intermediario);
            background-color: var(--off-white);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(181, 67, 32, 0.1);
            transition: all 0.3s ease;
        }

        .publication-row {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 1rem;
            align-items: start;
        }

        .publication-thumb {
            width: 130px;
            height: 95px;
            border-radius: 6px;
            object-fit: cover;
            display: block;
            background-color: var(--azul-intermediario);
            border: 2px solid var(--azul-escuro);
        }

        .publication-content { 
            min-width: 0; 
        }

        .publication-item:hover {
            border-left-color: var(--terracota-profunda);
            background-color: #f8f4f0;
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(181, 67, 32, 0.15);
        }

        .publication-title {
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 600;
            font-size: 20pt;
            color: var(--azul-escuro);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .publication-title a {
            color: inherit;
            text-decoration: none;
        }

        .publication-title a:hover {
            text-decoration: underline;
            color: var(--terracota-profunda);
        }

        .publication-authors {
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 300;
            font-size: 12pt;
            color: var(--texto-principal);
            margin-bottom: 0.5rem;
            font-style: italic;
        }

        .publication-venue {
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 400;
            font-size: 13pt;
            color: var(--azul-intermediario);
            margin-bottom: 0.5rem;
        }

        .publication-year {
            display: inline-block;
            background-color: var(--terracota-profunda);
            color: var(--off-white);
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 400;
            font-size: 10pt;
            margin-bottom: 0.5rem;
        }

        .publication-abstract {
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 300;
            font-size: 12pt;
            color: var(--texto-principal);
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .publication-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .publication-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.4rem 0.8rem;
            background-color: var(--azul-escuro);
            color: var(--off-white);
            text-decoration: none;
            border-radius: 4px;
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 400;
            font-size: 10pt;
            transition: all 0.3s ease;
        }

        .publication-link:hover {
            background-color: var(--terracota-profunda);
            color: var(--off-white);
            transform: translateY(-1px);
        }

        .publication-link.secondary {
            background-color: var(--azul-intermediario);
        }

        .publication-link.secondary:hover {
            background-color: var(--terracota-escura);
        }

        .publication-awards {
            display: inline-block;
            background-color: var(--terracota-escura);
            color: var(--off-white);
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 400;
            font-size: 10pt;
            margin-left: 0.5rem;
        }

        .publication-keywords {
            margin-top: 0.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .publication-keyword {
            background-color: var(--azul-intermediario);
            color: var(--off-white);
            padding: 0.2rem 0.5rem;
            border-radius: 8px;
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 400;
            font-size: 10pt;
        }

        /* Year Sections */
        .year-section {
            margin-bottom: 3rem;
        }

        .year-header {
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 600;
            font-size: 20pt;
            color: var(--azul-escuro);
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 3px solid var(--terracota-profunda);
            position: relative;
        }

        .year-header::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 50px;
            height: 3px;
            background-color: var(--azul-intermediario);
        }

        /* Loading and Error States */
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--azul-intermediario);
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 300;
            font-size: 12pt;
            font-style: italic;
        }

        .error {
            text-align: center;
            padding: 2rem;
            color: var(--terracota-escura);
            background-color: #fdf2f0;
            border-radius: 8px;
            margin: 1rem 0;
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 400;
            font-size: 12pt;
        }

        /* Filter Controls */
        .filter-controls {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background-color: var(--terracota-profunda);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(181, 67, 32, 0.2);
        }

        .filter-group {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-label {
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 600;
            font-size: 13pt;
            color: var(--off-white);
        }

        .filter-select {
            padding: 0.6rem 1rem;
            border: 2px solid var(--azul-escuro);
            border-radius: 6px;
            background-color: var(--off-white);
            color: var(--texto-principal);
            font-family: 'Manrope', Arial, sans-serif;
            font-weight: 400;
            font-size: 12pt;
            transition: all 0.3s ease;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--azul-intermediario);
            box-shadow: 0 0 0 3px rgba(23, 96, 120, 0.1);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .page-title {
                font-size: 40pt;
            }
            
            .publication-item {
                padding: 1rem;
            }
            
            .publication-row { 
                grid-template-columns: 100px 1fr; 
            }
            
            .publication-thumb { 
                width: 100px; 
                height: 75px; 
            }

            .publication-links {
                flex-direction: column;
            }
            
            .filter-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .filter-controls {
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 32pt;
            }
            
            .publication-title {
                font-size: 18pt;
            }
            
            .year-header {
                font-size: 18pt;
            }
        }
    </style>
</head>

<script>
// Configuration: Set this to use Google Sheets instead of JSON file
// Option 1: Use Google Sheets Published CSV (sheet must be published to web)
// Set GOOGLE_SHEET_ID to your full published CSV URL or sheet ID
// Option 2: Use Google Sheets API v4 (requires API key, but no OAuth)
// Set GOOGLE_SHEET_ID and GOOGLE_API_KEY
const GOOGLE_SHEET_ID = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRLP43ZpFZ5Qq6LfXhVz7_-CF4SqH0u-7dWeLW6CN8R9ooOz33ZpmNTuFPpTrRzZHaAYF51DtUpKpeM/pub?output=csv'; // Full published CSV URL or sheet ID
const GOOGLE_API_KEY = null; // Optional: Only needed for Method 2 (API v4)
const USE_GOOGLE_SHEETS = true; // Set to true to load from Google Sheets

// Publications data and functionality
let publicationsData = [];
let filteredPublications = [];

// Extract sheet ID from URL
function getSheetIdFromUrl(url) {
    const match = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    return match ? match[1] : null;
}

// Parse comma-separated values
function parseCSV(value) {
    if (!value || !value.trim()) return [];
    return value.split(',').map(item => item.trim()).filter(item => item);
}

// Convert row data to publication object
function rowToPublication(row, headers) {
    const pub = {};
    const rowData = {};
    
    // Map headers to row values
    headers.forEach((header, index) => {
        rowData[header.toLowerCase()] = row[index] || '';
    });
    
    // Required fields
    pub.id = (rowData.id || '').trim();
    pub.title = (rowData.title || '').trim();
    pub.authors = parseCSV(rowData.authors || '');
    pub.venue = (rowData.venue || '').trim();
    pub.year = parseInt(rowData.year) || null;
    pub.type = (rowData.type || '').trim().toLowerCase();
    
    // Optional fields
    // Handle thumbnail - extract URL from IMAGE() formula or use direct URL

    if (rowData.thumbnail || rowData.thumbnail_link) {
        
        let thumbnail = rowData.thumbnail || rowData.thumbnail_link
        thumbnail = thumbnail.trim();
        // Extract URL from IMAGE() formula if present
        // Format: =IMAGE("url") or =IMAGE(url)
        const imageFormulaMatch = thumbnail.match(/^=IMAGE\(["']?([^"')]+)["']?\)/i);
        if (imageFormulaMatch) {
            thumbnail = imageFormulaMatch[1];
        }
        // Remove any remaining quotes
        thumbnail = thumbnail.replace(/^["']|["']$/g, '');
        
        // Convert Google Drive shareable link to direct image URL
        // Format: https://drive.google.com/file/d/FILE_ID/view?usp=sharing
        // Or: https://drive.google.com/open?id=FILE_ID
        // Also handles: https://drive.google.com/file/d/FILE_ID/view
        const driveMatch = thumbnail.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([a-zA-Z0-9_-]+)/);
        if (driveMatch) {
            const fileId = driveMatch[1];
            // Use thumbnail format for better performance and reliability
            // This format works better for images and is more reliable
            thumbnail = `https://drive.google.com/thumbnail?id=${fileId}&sz=w130-h95?authuser=0`;
            console.log(`Converted Google Drive link: ${rowData.thumbnail.substring(0, 60)}... → ${thumbnail}`);
        }
        
        if (thumbnail) {
            pub.thumbnail = thumbnail;
        }
    }
    if (rowData.pdf) pub.pdf = rowData.pdf.trim();
    if (rowData.abstract) pub.abstract = rowData.abstract.trim();
    
    const keywords = parseCSV(rowData.keywords || '');
    if (keywords.length > 0) pub.keywords = keywords;
    
    const awards = parseCSV(rowData.awards || '');
    if (awards.length > 0) pub.awards = awards;
    
    // Build links object
    const links = {};
    if (rowData.demo_link) links.demo = rowData.demo_link.trim();
    if (rowData.code_link) links.code = rowData.code_link.trim();
    if (rowData.video_link) links.video = rowData.video_link.trim();
    if (rowData.website_link) links.website = rowData.website_link.trim();
    if (rowData.software_link) links.software = rowData.software_link.trim();
    if (Object.keys(links).length > 0) pub.links = links;
    
    return pub;
}

// Simple CSV parser that handles quoted fields with commas
function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    
    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        
        if (char === '"') {
            if (inQuotes && line[i + 1] === '"') {
                // Escaped quote
                current += '"';
                i++;
            } else {
                // Toggle quote state
                inQuotes = !inQuotes;
            }
        } else if (char === ',' && !inQuotes) {
            // Field separator
            result.push(current.trim());
            current = '';
        } else {
            current += char;
        }
    }
    
    // Add the last field
    result.push(current.trim());
    return result;
}

// Method 1: Load from Google Sheets Published CSV (sheet must be published)
async function loadFromGoogleSheetsJSONFeed(sheetIdOrUrl) {
    // Supports both sheet ID and full published CSV URL
    // Published URL format: https://docs.google.com/spreadsheets/d/e/.../pub?gid=...&single=true&output=csv
    let url;
    
    if (sheetIdOrUrl.startsWith('http')) {
        // Full URL provided - use it directly
        url = sheetIdOrUrl;
        // Ensure output=csv is in the URL
        if (!url.includes('output=csv')) {
            url += (url.includes('?') ? '&' : '?') + 'output=csv';
        }
    } else {
        // Sheet ID provided - construct published CSV URL
        // For published sheets with /e/ format
        url = `https://docs.google.com/spreadsheets/d/e/${sheetIdOrUrl}/pub?output=csv`;
    }
    
    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Failed to fetch sheet');
        
        const csvText = await response.text();

        const lines = csvText.split('\n').filter(line => line.trim());
        
        if (lines.length < 2) throw new Error('Sheet has no data');
        
        // Parse headers (first line)
        const headers = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
        
        // Parse data rows
        const publications = [];
        for (let i = 1; i < lines.length; i++) {
            const row = parseCSVLine(lines[i]);
            const pub = rowToPublication(row, headers);
            
            // Validate required fields
            if (!pub.id || !pub.title || pub.authors.length === 0 || !pub.venue || !pub.year || !pub.type) {
                console.warn(`Skipping row ${i + 1}: missing required fields`);
                continue;
            }
            
            publications.push(pub);
        }
        
        return publications;
    } catch (error) {
        console.error('Error loading from Google Sheets CSV:', error);
        throw error;
    }
}

// Method 2: Load from Google Sheets API v4 (requires API key, but no OAuth)
async function loadFromGoogleSheetsAPI(sheetId, apiKey) {
    if (!apiKey) {
        throw new Error('Google API key is required for this method');
    }
    
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Sheet1?key=${apiKey}`;
    
    try {
        const response = await fetch(url);
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error?.message || 'Failed to fetch sheet');
        }
        
        const data = await response.json();
        const values = data.values;
        
        if (!values || values.length < 2) {
            throw new Error('Sheet has no data');
        }
        
        // First row is headers
        const headers = values[0].map(h => h.trim().toLowerCase());
        
        // Parse rows
        const publications = [];
        for (let i = 1; i < values.length; i++) {
            const row = values[i];
            const pub = rowToPublication(row, headers);
            
            // Validate required fields
            if (!pub.id || !pub.title || pub.authors.length === 0 || !pub.venue || !pub.year || !pub.type) {
                console.warn(`Skipping row ${i + 1}: missing required fields`);
                continue;
            }
            
            publications.push(pub);
        }
        
        return publications;
    } catch (error) {
        console.error('Error loading from Google Sheets API:', error);
        throw error;
    }
}

// Load publications data
async function loadPublications() {
    try {
        let publications = [];
        
        if (USE_GOOGLE_SHEETS && GOOGLE_SHEET_ID) {
            // Try to load from Google Sheets
            try {
                if (GOOGLE_API_KEY) {
                    // Method 2: Use API v4
                    publications = await loadFromGoogleSheetsAPI(GOOGLE_SHEET_ID, GOOGLE_API_KEY);
                } else {
                    // Method 1: Use JSON Feed (sheet must be published)
                    publications = await loadFromGoogleSheetsJSONFeed(GOOGLE_SHEET_ID);
                }
            } catch (sheetsError) {
                console.error('Failed to load from Google Sheets, falling back to JSON:', sheetsError);
                // Fallback to JSON file
                const response = await fetch('publications/publications.json');
                if (!response.ok) throw new Error('Failed to load publications');
                const data = await response.json();
                publications = data.publications;
            }

            //  sync json with sheet data            
        } else {
            // Load from JSON file
            const response = await fetch('publications/publications.json');
            if (!response.ok) {
                throw new Error('Failed to load publications');
            }
            const data = await response.json();
            publications = data.publications;
        }
        
        publicationsData = publications;
        filteredPublications = [...publicationsData];
        
        // Sort by year (newest first)
        filteredPublications.sort((a, b) => b.year - a.year);
        
        populateFilters();
        renderPublications();
    } catch (error) {
        console.error('Error loading publications:', error);
        document.getElementById('publicationsContainer').innerHTML = 
            '<div class="error">Error loading publications. Please try again later.</div>';
    }
}

// Populate filter dropdowns
function populateFilters() {
    const yearFilter = document.getElementById('yearFilter');
    const typeFilter = document.getElementById('typeFilter');
    
    // Get unique years
    const years = [...new Set(publicationsData.map(pub => pub.year))].sort((a, b) => b - a);
    
    // Clear existing options (except "All")
    yearFilter.innerHTML = '<option value="">All Years</option>';
    years.forEach(year => {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        yearFilter.appendChild(option);
    });
    
    // Add event listeners
    yearFilter.addEventListener('change', filterPublications);
    typeFilter.addEventListener('change', filterPublications);
}

// Filter publications
function filterPublications() {
    const yearFilter = document.getElementById('yearFilter').value;
    const typeFilter = document.getElementById('typeFilter').value;
    
    filteredPublications = publicationsData.filter(pub => {
        const yearMatch = !yearFilter || pub.year.toString() === yearFilter;
        const typeMatch = !typeFilter || pub.type === typeFilter;
        return yearMatch && typeMatch;
    });
    
    // Sort by year (newest first)
    filteredPublications.sort((a, b) => b.year - a.year);
    
    renderPublications();
}

// Render publications
function renderPublications() {
    const container = document.getElementById('publicationsContainer');
    
    if (filteredPublications.length === 0) {
        container.innerHTML = '<div class="loading">No publications found matching the selected filters.</div>';
        return;
    }
    
    // Group by year
    const publicationsByYear = {};
    filteredPublications.forEach(pub => {
        if (!publicationsByYear[pub.year]) {
            publicationsByYear[pub.year] = [];
        }
        publicationsByYear[pub.year].push(pub);
    });
    
    // Render by year
    let html = '';
    Object.keys(publicationsByYear)
        .sort((a, b) => b - a) // Sort years descending
        .forEach(year => {
            html += `<div class="year-section">
                <h2 class="year-header">${year}</h2>`;
            
            publicationsByYear[year].forEach(pub => {
                html += renderPublication(pub);
            });
            
            html += '</div>';
        });
    
    container.innerHTML = html;
}

// Render individual publication
function renderPublication(pub) {
    // Handle image source - escape for HTML and add error handling
    const imageSrc = pub.thumbnail || 'home/00477a68b36e957f321711cc13e44054.jpg';
    const fallbackImage = 'home/00477a68b36e957f321711cc13e44054.jpg';
    
    // Debug logging for Google Drive images
    if (pub.thumbnail && pub.thumbnail.includes('drive.google.com')) {
        console.log(`Rendering Google Drive image for "${pub.title.substring(0, 40)}...": ${pub.thumbnail}`);
    }
    
    let html = `<div class="publication-item">
        <div class="publication-row">
            <img class="publication-thumb" 
                 src="${imageSrc}" 
                 alt="${pub.title} thumbnail" 
                 onerror="console.error('Image failed to load:', '${imageSrc}'); this.src='${fallbackImage}'; this.onerror=null;">
            <div class="publication-content">
                <div class="publication-title">
                    ${pub.pdf ? `<a href="${pub.pdf}" target="_blank">${pub.title}</a>` : pub.title}
                </div>
                <div class="publication-authors">${pub.authors.join(', ')}</div>
                <div class="publication-venue">${pub.venue}</div>
                <div>
                    <span class="publication-year">${pub.year}</span>`;
    
    if (pub.awards && pub.awards.length > 0) {
        pub.awards.forEach(award => {
            html += `<span class="publication-awards">${award}</span>`;
        });
    }
    
    html += `</div>`;
    
    if (pub.abstract) {
        html += `<div class="publication-abstract">${pub.abstract}</div>`;
    }
    
    if (pub.links || pub.pdf) {
        html += '<div class="publication-links">';
        
        if (pub.pdf) {
            html += `<a href="${pub.pdf}" target="_blank" class="publication-link">
                <span>📄</span> PDF
            </a>`;
        }
        
        if (pub.links) {
            Object.entries(pub.links).forEach(([type, url]) => {
                const icon = getLinkIcon(type);
                const label = getLinkLabel(type);
                html += `<a href="${url}" target="_blank" class="publication-link secondary">
                    <span>${icon}</span> ${label}
                </a>`;
            });
        }
        
        html += '</div>';
    }
    
    if (pub.keywords && pub.keywords.length > 0) {
        html += '<div class="publication-keywords">';
        pub.keywords.forEach(keyword => {
            html += `<span class="publication-keyword">${keyword}</span>`;
        });
        html += '</div>';
    }
    
    html +=`    </div>
            </div>
        </div>
    </div>`;
    return html;
}

// Get icon for link type
function getLinkIcon(type) {
    const icons = {
        'demo': '🎮',
        'code': '💻',
        'video': '🎥',
        'website': '🌐',
        'software': '⚙️'
    };
    return icons[type] || '🔗';
}

// Get label for link type
function getLinkLabel(type) {
    const labels = {
        'demo': 'Demo',
        'code': 'Code',
        'video': 'Video',
        'website': 'Website',
        'software': 'Software'
    };
    return labels[type] || type.charAt(0).toUpperCase() + type.slice(1);
}

// Initialize when page loads
document.addEventListener('DOMContentLoaded', loadPublications);
</script>
<script>
// Mobile menu toggle functionality
(function() {
    const menuButton = document.getElementById('s9iPrd');
    const menu = document.getElementById('yuynLe');
    const backdrop = document.querySelector('.TxnWlb[jsname="BDdyze"]');
    
    if (menuButton && menu) {
        // Toggle menu function
        function toggleMenu() {
            const isExpanded = menuButton.getAttribute('aria-expanded') === 'true';
            menuButton.setAttribute('aria-expanded', !isExpanded);
            if (isExpanded) {
                menu.classList.remove('jsnVQ');
            } else {
                menu.classList.add('jsnVQ');
            }
        }
        
        // Open menu on button click
        menuButton.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            toggleMenu();
        });
        
        // Close menu on backdrop click
        if (backdrop) {
            backdrop.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                toggleMenu();
            });
        }
        
        // Close menu when clicking on a menu link
        const menuLinks = menu.querySelectorAll('a[href]');
        menuLinks.forEach(function(link) {
            link.addEventListener('click', function() {
                setTimeout(function() {
                    toggleMenu();
                }, 100);
            });
        });
    }
})();
</script>
